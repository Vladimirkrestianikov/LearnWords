[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learnwords"
version = "1.0.0"
description = "LearnWords - Intelligent Telegram English Tutor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "openai>=1.65.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "greenlet>=3.1.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "apscheduler>=3.11.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "aiofiles>=24.1.0",
]

[tool.setuptools.packages.find]
include = ["learnwords*"]
